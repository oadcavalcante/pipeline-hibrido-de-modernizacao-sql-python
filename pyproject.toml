[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-modernizer"
version = "0.1.0"
description = "Pipeline híbrido LLM + Rules para modernizar stored procedures PL/pgSQL → Python 3.14"
requires-python = ">=3.14"
dependencies = [
    # LangGraph / LangChain
    "langgraph>=0.2",
    "langgraph-cli[inmem]>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Banco de dados
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    # Parsing SQL
    "sqlglot>=25",
    # Configuração
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Observabilidade
    "langfuse>=2.50,<3",
    # Utilitários
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psycopg2",
]

[project.scripts]
modernizer = "pipeline.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: testes que exigem PostgreSQL (TEST_BEHAVIORAL=1)",
]
